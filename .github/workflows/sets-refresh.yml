# Fast lane for the set radar only (Scryfall + whatsinstandard + MythicSpoiler
# — the last one for cards that surface before Scryfall catalogs them), so panel
# spoilers and fresh leaks reach the app within a couple of hours, not next-day.
# Runs every 4h; the full daily-meta workflow also covers 06:00 UTC.
name: Set radar refresh

on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:

jobs:
  sets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm ci

      # Aborts without writing when Scryfall is unavailable — the previously
      # published sets.json stays live. MythicSpoiler is fail-soft: if it's down
      # the build still ships Scryfall-only rather than aborting.
      - name: Build set radar (Arena-first spoilers, no Alchemy)
        id: build_sets
        run: npm run sets
        continue-on-error: true

      - name: Commit sets.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage the whole meta dirs, not a hand-listed pair of files.
          #
          # This listed only sets.json until 2026-08-11. v2.7.1 added the slim
          # index + per-set lazy galleries (public/meta/sets/<code>.json and the
          # website mirror), so `npm run sets` started writing ~19 files this
          # step never staged. The commit succeeded, the leftovers stayed
          # unstaged, and `git pull --rebase` then refused with
          # "cannot pull with rebase: You have unstaged changes" → exit 128.
          # Every 4-hourly run failed from 2026-08-09 to 2026-08-11 and the set
          # radar went stale, while the build step itself reported success.
          #
          # Directory form matches daily-meta.yml (which never broke for exactly
          # this reason) and survives the pipeline writing new paths under meta/.
          git add website/meta public/meta || true
          if git diff --staged --quiet; then
            echo "No set radar changes"
            exit 0
          fi
          git commit -m "chore: set radar refresh $(date -u +%Y-%m-%dT%H:%M)"

          # Rebase, and REBUILD rather than merge on conflict.
          #
          # Everything under meta/ is minified single-line JSON, so if a human
          # push touched the same file this run did, git cannot auto-merge it
          # and the rebase stops dead — the job then exits 1 and emails a
          # failure while the radar quietly goes stale. That is exactly what
          # happened on 2026-08-12: CI wrote arena-names.json in one shape while
          # a release changed its shape, and the two one-line files collided.
          #
          # There is never anything to hand-merge here. This output is a pure
          # function of the pipeline code and today's upstream data, so the
          # correct resolution is always "throw mine away, take theirs, build
          # again on top". Retried because the same race can recur.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Rebase/push failed (attempt $attempt) — rebuilding on top of origin/main"
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            git fetch origin main
            git reset --hard origin/main
            npm run sets || { echo "Rebuild failed"; exit 1; }
            git add website/meta public/meta || true
            if git diff --staged --quiet; then
              echo "Nothing left to commit after rebuild — upstream already current"
              exit 0
            fi
            git commit -m "chore: set radar refresh $(date -u +%Y-%m-%dT%H:%M)"
          done
          echo "Could not push after 3 attempts"
          exit 1

      - name: Open/update failure issue when the sets build fails
        if: steps.build_sets.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Set radar refresh failure';
            const body = [
              '## Set radar refresh reported a failure',
              '',
              `- run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- when: ${new Date().toISOString()}`,
              '',
              '- `npm run sets` failed (previous sets.json left untouched if abort).',
              '',
              '_Auto-opened so silent set-radar rot is impossible. Close when fixed._',
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 30,
            });
            const existing = issues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
