# Deploy the marketing site + meta CDN + downloads from website/
# NOTE: no build command — the daily meta pipeline runs in GitHub Actions
# (.github/workflows/daily-meta.yml) and commits the JSON. Running it here would
# let a "no live data" abort fail the whole site deploy (including downloads).
# ⚠️ THIS FILE IS NOT READ BY NETLIFY. ⚠️
#
# The site's base directory is `website`, so Netlify reads `website/netlify.toml`
# instead. Verified 2026-07-30 against live response headers: /meta/latest.json
# returns max-age=120 + Access-Control-Allow-Headers (the website/ values), while
# the /meta-web/* max-age=300 and /assets/og-image.png max-age=86400 rules below
# return max-age=0 — i.e. they have never applied.
#
# This also explains handoff.md §1: the /meta-web/* cache fix "never showed up
# live" because this file is inert, not because of a pinned deploy.
#
# Do NOT add config here — put it in website/netlify.toml. This file is kept
# only until the base-directory question is settled (see docs/INSTALL-COUNTING.md
# "Which netlify.toml is live").

[build]
  publish = "website"

# Force UTF-8 so em dashes / curly quotes never mojibake
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

# The public meta-web deck pages are regenerated daily by the meta cron. Without
# an explicit short cache they stuck at Netlify's edge and lagged fresh deploys
# by hours (observed 2026-07-22: a page kept serving a stale, out-of-band build
# after several deploys had shipped the corrected one). A 5-minute cache keeps
# them fresh-on-deploy like /meta/* while staying CDN-friendly.
[[headers]]
  for = "/meta-web/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# CORS so the Tauri desktop app can fetch meta + version + updater manifest
[[headers]]
  for = "/meta/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/version.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/updater/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Cache-Control = "public, max-age=60"

# Installers are large and immutable per-version — cache hard
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# Social preview image
[[headers]]
  for = "/assets/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "image/png"

