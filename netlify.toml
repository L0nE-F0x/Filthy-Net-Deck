# Deploy the marketing site + meta CDN + downloads from website/
# NOTE: no build command — the daily meta pipeline runs in GitHub Actions
# (.github/workflows/daily-meta.yml) and commits the JSON. Running it here would
# let a "no live data" abort fail the whole site deploy (including downloads).
# THE TWO netlify.toml FILES — BOTH ARE LIVE, FOR DIFFERENT THINGS.
# (Verified empirically 2026-07-30; see docs/INSTALL-COUNTING.md.)
#
#   • THIS file — build config: `publish` and [functions]. Read because the
#     Netlify base directory is the repo root. Deploy log confirms:
#     "Starting to deploy site from 'website'".
#   • website/netlify.toml — HEADERS AND REDIRECTS. Honoured because it sits
#     inside the publish directory, and it is what live response headers match.
#
# ⚠️ A redirect or [[headers]] block added HERE will silently do nothing.
#    Put those in website/netlify.toml.
#
# The [[headers]] rules below have therefore never applied. Reviewed 2026-07-30
# against live responses; everything currently serves Netlify's default
# `public, max-age=0, must-revalidate`. Only one was worth porting:
#
#   • /assets/og-image.png (max-age=86400) — PORTED to website/netlify.toml.
#   • /meta-web/* (max-age=300) — NOT ported. It would make pages *staler* than
#     the current max-age=0. The handoff.md §1 "fix" was misconceived: the
#     default already revalidates on every request.
#   • /updater/* (max-age=60 + CORS) — NOT ported, deliberately. Caching the
#     update manifest is the wrong direction, and the CORS headers are dead
#     weight: the Tauri updater fetches via reqwest, not browser fetch, so
#     no preflight is ever involved.
#   • /*.html UTF-8 Content-Type — already present in website/netlify.toml.
#
# Leaving the rules here for provenance. Do not "fix" them by porting wholesale.

[build]
  publish = "website"
  # NOTE: no `command` here on purpose. The Netlify UI has a build command set
  # (`node pipeline/build-meta.mjs`). Setting one in this file would silently
  # override it, so leave it to the dashboard until the two are reconciled.

# Install counting — docs/INSTALL-COUNTING.md. Inert until the base directory
# moves to the repo root, at which point Netlify bundles these using the
# repo-root package.json. `netlify/functions` is outside `website`, so the
# sources are never published as static assets.
[functions]
  directory = "netlify/functions"

# NOTE: the /version.json → function redirect is deliberately NOT here yet.
# Shipping it before the function was confirmed live 404'd the endpoint on
# 2026-07-30. Add it only after /api/fnd-stats returns 503 rather than 404.

# Force UTF-8 so em dashes / curly quotes never mojibake
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

# The public meta-web deck pages are regenerated daily by the meta cron. Without
# an explicit short cache they stuck at Netlify's edge and lagged fresh deploys
# by hours (observed 2026-07-22: a page kept serving a stale, out-of-band build
# after several deploys had shipped the corrected one). A 5-minute cache keeps
# them fresh-on-deploy like /meta/* while staying CDN-friendly.
[[headers]]
  for = "/meta-web/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# CORS so the Tauri desktop app can fetch meta + version + updater manifest
[[headers]]
  for = "/meta/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/version.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/updater/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Cache-Control = "public, max-age=60"

# Installers are large and immutable per-version — cache hard
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# Social preview image
[[headers]]
  for = "/assets/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "image/png"

