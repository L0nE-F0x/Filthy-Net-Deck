# THIS is the config Netlify actually reads — the site's base directory is
# `website`. The repo-root netlify.toml is inert; see the warning at the top of
# it. Put all Netlify config here.

[build]
  publish = "."
  # Optional: run pipeline before publish when wired to CI
  # command = "node ../pipeline/build-meta.mjs --seed"

# HOW THE TWO netlify.toml FILES SPLIT (verified empirically 2026-07-30):
#   • repo-root netlify.toml — build config: publish dir + [functions]. Read
#     because the Netlify base directory is the repo root.
#   • THIS file — headers and redirects. Honoured because it sits inside the
#     publish directory. Live response headers match this file, not the root
#     one (e.g. /meta/* max-age=120 + Access-Control-Allow-Headers).
# So: functions go in the root file, redirects and headers go here.

# Install counting is NOT wired here — and /version.json is the wrong endpoint
# for it. src/store/useAppStore.ts::checkForUpdates tries the signed Tauri
# updater first (/updater/latest.json) and returns early whenever it answers.
# /version.json is only a fallback for when that check fails, so in normal
# operation no install ever requests it. Measured: 0 app hits.
# See docs/INSTALL-COUNTING.md "Why this endpoint was the wrong target".

# Force UTF-8 so em dashes / curly quotes never mojibake in browsers
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

# CORS so the Tauri desktop app can fetch meta + version.json
[[headers]]
  for = "/meta/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Accept"
    Cache-Control = "public, max-age=120"

[[headers]]
  for = "/version.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Accept"
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# Ported from the repo-root netlify.toml, which Netlify never reads for headers
# (see the warning at the top of that file). Social scrapers refetch the OG card
# constantly and it only changes on release, so a day of caching is free. This
# was the ONLY dead rule worth porting — see the note in the root file for the
# two that were deliberately left behind.
[[headers]]
  for = "/assets/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "image/png"
