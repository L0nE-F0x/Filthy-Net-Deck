# THIS is the config Netlify actually reads — the site's base directory is
# `website`. The repo-root netlify.toml is inert; see the warning at the top of
# it. Put all Netlify config here.

[build]
  publish = "."
  # Optional: run pipeline before publish when wired to CI
  # command = "node ../pipeline/build-meta.mjs --seed"

# NOTE: install counting (docs/INSTALL-COUNTING.md) cannot be wired up in this
# file. Netlify requires the functions directory to sit OUTSIDE the publish
# directory, and here base == publish == `website`, so no such location exists.
# Two attempts on 2026-07-30 confirmed it: the first 404'd /version.json (the
# redirect deployed, the function did not), and the second published the
# function sources as static assets at /netlify/functions/*.mts instead of
# building them.
#
# The functions now live at the repo root and are configured in the repo-root
# netlify.toml, which activates once the base directory is moved to the root.
# At that point THIS file becomes the inert one and should be deleted.

# Force UTF-8 so em dashes / curly quotes never mojibake in browsers
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

# CORS so the Tauri desktop app can fetch meta + version.json
[[headers]]
  for = "/meta/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Accept"
    Cache-Control = "public, max-age=120"

[[headers]]
  for = "/version.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Accept"
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
