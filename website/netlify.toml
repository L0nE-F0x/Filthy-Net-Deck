# THIS is the config Netlify actually reads — the site's base directory is
# `website`. The repo-root netlify.toml is inert; see the warning at the top of
# it. Put all Netlify config here.

[build]
  publish = "."
  # Optional: run pipeline before publish when wired to CI
  # command = "node ../pipeline/build-meta.mjs --seed"

# HOW THE TWO netlify.toml FILES SPLIT (verified empirically 2026-07-30):
#   • repo-root netlify.toml — build config: publish dir + [functions]. Read
#     because the Netlify base directory is the repo root.
#   • THIS file — headers and redirects. Honoured because it sits inside the
#     publish directory. Live response headers match this file, not the root
#     one (e.g. /meta/* max-age=120 + Access-Control-Allow-Headers).
# So: functions go in the root file, redirects and headers go here.

# Install counting — docs/INSTALL-COUNTING.md. Forced because the static
# version.json sits at this same path and would otherwise win.
# TO REVERT: delete this one block. The static file is still published and
# serves the endpoint again on the next deploy.
# DO NOT add this block unless /.netlify/functions/version already returns 200
# with an `X-FND-Manifest: function` header — shipping it blind 404'd the
# endpoint on 2026-07-30.
[[redirects]]
  from = "/version.json"
  to = "/.netlify/functions/version"
  status = 200
  force = true

# Force UTF-8 so em dashes / curly quotes never mojibake in browsers
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

# CORS so the Tauri desktop app can fetch meta + version.json
[[headers]]
  for = "/meta/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Accept"
    Cache-Control = "public, max-age=120"

[[headers]]
  for = "/version.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Accept"
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
