[package]
name = "filthy-net-deck"
version = "3.1.1"
description = "Filthy Net Deck — MTG Arena meta companion"
authors = ["you"]
edition = "2021"

[lib]
name = "filthy_net_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.5.9"
tauri-plugin-store = "2.4.3"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# OS RNG for the health-ping install id (install_id.rs). Already in the tree as
# a transitive dep at this major, so pinning 0.3 adds no new build.
getrandom = "0.3"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# OAuth callback: the system browser hands the app back a `fnd://auth?...` URL.
# Google refuses OAuth from embedded webviews, so this hop is mandatory.
tauri-plugin-deep-link = "2"
